[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-gui"
version = "0.2.0"
description = "Persistent across-episode visual experience for token-efficient GUI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Aiden Yang"}]
dependencies = [
  "torch>=2.4,<3",
  "transformers>=4.57,<5",
  "qwen-vl-utils>=0.0.14,<0.1",
  "numpy>=1.26,<3",
  "Pillow>=10.0,<13",
]

[tool.setuptools.packages.find]
include = ["memento*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
