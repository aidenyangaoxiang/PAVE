[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-gui"
version = "0.1.0"
description = "Persistent visual experience for efficient screenshot-based GUI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Aiden Yang"}]
dependencies = [
  "torch>=2.4",
  "transformers>=4.57",
  "qwen-vl-utils>=0.0.14",
  "numpy>=1.26",
  "Pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["memento*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
