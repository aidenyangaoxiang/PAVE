[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memento-gui"
version = "0.2.0"
description = "PAVE: experience-guided visual token selection for frozen GUI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Aoxiang Yang"}]
dependencies = [
  "torch>=2.4,<3",
  "transformers>=4.57,<5",
  "qwen-vl-utils>=0.0.14,<0.1",
  "numpy>=1.26,<3",
  "Pillow>=10.0,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["memento*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
